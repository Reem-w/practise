<div class="container m-5">
  <div>
    <input type="text" [(ngModel)]="stName" placeholder="Enter student name" name="stName" />
    <p class="text-danger" [ngStyle]="{ display: requiredName ? 'none' : 'block' }" >
      Name is Required
    </p>
    <p class="text-danger" [ngStyle]="{ display: validName ? 'none' : 'block' }">
      Length must be > 3
    </p>
  </div>
  <div>
    <input
      class="mt-3"
      type="text"
      [(ngModel)]="stAge"
      placeholder="Enter student age"
      name="stAge"
    />
    <p class="text-danger" [ngStyle]="{ display: requiredAge ? 'none' : 'block' }">
      Age is Required
    </p>
    <p class="text-danger" [ngStyle]="{ display: validAge ? 'none' : 'block' }">Age must be > 18</p>
  </div>
  <button class="mt-3" (click)="addStudent()">Add Student</button>
</div>

<div class="mt-5 mx-auto container d-flex align-items-center justify-content-center">
  <table class="table table-striped">
    <tr>
      <th class="text-center">Id</th>
      <th class="text-center">Name</th>
      <th class="text-center">Age</th>
      <th class="text-center">Actions</th>
    </tr>
    <tr *ngFor="let st of students; let i = index">
      <td class="text-center">{{ st.id }}</td>
      <td class="text-center">{{ st.name }}</td>
      <td class="text-center">{{ st.age }}</td>
      <td class="text-center"><button class="btn btn-danger" (click)="deleteStudent(i)">Delete</button></td>
    </tr>
  </table>
</div>
